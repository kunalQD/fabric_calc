<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard – Quilt & Drapes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:linear-gradient(180deg,#f8fafc 0%, #eef2f7 100%);
  font-size:14px;
}

/* Navbar */
.navbar{
  background:#1f2933;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.nav-link.active{
  font-weight:600;
  border-bottom:2px solid #fff;
}


/* KPI */
.kpi-card{
  border-radius:16px;
  padding:16px;
  color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}
.kpi-orders{background:linear-gradient(135deg,#2563EB,#1D4ED8);}
.kpi-pending{background:linear-gradient(135deg,#D97706,#B45309);}
.kpi-stitching{background:linear-gradient(135deg,#7C3AED,#5B21B6);}
.kpi-completed{background:linear-gradient(135deg,#10B981,#059669);}

/* Filters */
.filter-card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}

/* Kanban Board */
.kanban-board{
  display:flex;
  gap:16px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding-bottom:10px;
}

.kanban-column{
  min-width:300px;
  border-radius:18px;
  padding:14px;
  max-height:75vh;
  overflow-y:auto;
  color:#fff;
  scroll-snap-align:start;
  position:relative;
  background-size:200% 200%;
  animation:gradientMove 8s ease infinite;
}

/* Gradient animation */
@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Column Colors */
.col-pending{background:linear-gradient(135deg,#F59E0B,#B45309,#FBBF24);}
.col-transit{background:linear-gradient(135deg,#0EA5E9,#0369A1,#38BDF8);}
.col-stitching{background:linear-gradient(135deg,#7C3AED,#5B21B6,#A78BFA);}
.col-install{background:linear-gradient(135deg,#8B5CF6,#6D28D9,#C4B5FD);}
.col-completed{background:linear-gradient(135deg,#10B981,#047857,#6EE7B7);}

/* Column header */
.column-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.count-badge{
  background:#111827;
  color:#fff;
  font-size:12px;
  padding:4px 8px;
  border-radius:999px;
}

/* Collapse button */
.collapse-btn{
  background:rgba(255,255,255,0.3);
  border:none;
  color:#fff;
  font-size:12px;
  padding:3px 8px;
  border-radius:6px;
}

/* Cards */
.kanban-card{
  background:#ffffff;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  cursor:pointer;
  transition:.2s;
  color:#111827;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.kanban-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 24px rgba(0,0,0,.35);
}

/* Dragging shadow */
.kanban-card.dragging{
  opacity:0.6;
  transform:rotate(2deg);
  box-shadow:0 16px 40px rgba(0,0,0,.4);
}

/* Overdue */
.order-urgent{
  border:2px solid #dc2626;
  background:#fff1f2;
}

/* Floating button */
.fab{
  position:fixed;
  right:20px;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  text-decoration:none;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}
.kpi-install{
  background:linear-gradient(135deg,#8B5CF6,#6D28D9);
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-semibold" href="/dashboard">
    Quilt & Drapes
  </a>

  <button class="navbar-toggler" type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="mainNavbar">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

      <li class="nav-item">
        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}"
           href="/dashboard">
           Dashboard
        </a>
      </li>

      {% if session.get('role') == 'admin' %}
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/billing' %}active{% endif %}"
           href="/billing">
           Billing
        </a>
      </li>
      {% endif %}

      <li class="nav-item">
        <a class="nav-link {% if request.path == '/calendar' %}active{% endif %}"
           href="/calendar">
           Calendar
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if request.path == '/calculator' %}active{% endif %}"
           href="/calculator">
           New Order
        </a>
      </li>

    </ul>

    <div class="d-flex align-items-center gap-3">
      <span class="text-success small">● Live</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">
        Logout
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 mt-4">

<div class="row g-4 mb-4 justify-content-center">

<div class="col-lg-2 col-md-4 col-sm-6">
  <div class="kpi-card kpi-orders text-center">
    <div>Orders</div>
    <h3 id="kpiOrders">0</h3>
  </div>
</div>

<div class="col-lg-2 col-md-4 col-sm-6">
  <div class="kpi-card kpi-pending text-center">
    <div>Fabric Pending</div>
    <h3 id="kpiFabricPending">0</h3>
  </div>
</div>

<div class="col-lg-2 col-md-4 col-sm-6">
  <div class="kpi-card kpi-stitching text-center">
    <div>Stitching</div>
    <h3 id="kpiStitching">0</h3>
  </div>
</div>

<div class="col-lg-2 col-md-4 col-sm-6">
  <div class="kpi-card kpi-install text-center">
    <div>Hardware / Installation</div>
    <h3 id="kpiInstall">0</h3>
  </div>
</div>

<div class="col-lg-2 col-md-4 col-sm-6">
  <div class="kpi-card kpi-completed text-center">
    <div>Completed</div>
    <h3 id="kpiCompleted">0</h3>
  </div>
</div>

</div>



<!-- Filters -->
<div class="filter-card mb-4">
  <div class="d-flex flex-wrap gap-3 align-items-center">
    <input id="searchInput" class="form-control" style="max-width:280px"
      placeholder="Search name / phone / showroom">
    <select id="tailorFilter" class="form-select" style="max-width:180px">
      <option value="">All Tailors</option>
      <option>Dev</option>
      <option>Dinesh</option>
    </select>
    <select id="fitterFilter" class="form-select" style="max-width:180px">
      <option value="">All Fitters</option>
      <option>Dev</option>
      <option>Dinesh</option>
      <option>Krishna</option>
    </select>
  </div>
</div>

<div class="kanban-board" id="kanbanBoard"></div>

</div>

<a href="/calculator" class="fab">+</a>

<script>
const STATUSES=[
"Fabric Order Pending",
"Fabric In Transit",
"Stitching",
"Hardware/Material Installation",
"Completed"
];

function getColumnClass(status){
  if(status==="Fabric Order Pending") return "col-pending";
  if(status==="Fabric In Transit") return "col-transit";
  if(status==="Stitching") return "col-stitching";
  if(status==="Hardware/Material Installation") return "col-install";
  if(status==="Completed") return "col-completed";
  return "";
}
async function loadKPIs(){
  const d=await(await fetch("/api/dashboard/kpis")).json();
  kpiOrders.innerText=d.orders||0;
  kpiFabricPending.innerText=d.fabric_pending||0;
  kpiStitching.innerText=d.stitching||0;
  kpiInstall.innerText=d.installation||0;   // ✅ NEW
  kpiCompleted.innerText=d.completed||0;
}


async function loadOrders(){
  const res=await fetch("/api/orders/list");
  const data=await res.json();
  renderBoard(data);
}

function renderBoard(data){
  const board=document.getElementById("kanbanBoard");
  board.innerHTML="";
  const today=new Date();

  STATUSES.forEach(status=>{
    const orders=data.filter(o=>o.status===status);
    const col=document.createElement("div");
    col.className="kanban-column "+getColumnClass(status);

    col.innerHTML=`
      <div class="column-header">
        <div><strong>${status}</strong></div>
        <div>
          <span class="count-badge">${orders.length}</span>
          ${status==="Completed" ? '<button class="collapse-btn" onclick="toggleCompleted(this)">Hide</button>' : ''}
        </div>
      </div>
      <div class="column-content"></div>
    `;

    const content=col.querySelector(".column-content");

    orders.forEach(o=>{
      let urgent="";
      if(o.due_date && new Date(o.due_date)<today) urgent="order-urgent";
      content.innerHTML+=`
      <div class="kanban-card ${urgent}" draggable="true"
           ondragstart="this.classList.add('dragging')"
           ondragend="this.classList.remove('dragging')"
           onclick="location.href='/calculator?order_id=${o.order_id}'">
        <strong>${o.name}</strong><br>
        <small>${o.showroom}</small><br>
        👕 ${o.tailor||'-'} | 🔧 ${o.fitter||'-'}
      </div>`;
    });

    board.appendChild(col);
  });
}

function toggleCompleted(btn){
  const col=btn.closest(".kanban-column");
  const content=col.querySelector(".column-content");
  if(content.style.display==="none"){
    content.style.display="block";
    btn.innerText="Hide";
  }else{
    content.style.display="none";
    btn.innerText="Show";
  }
}

/* Live refresh */
setInterval(()=>{
 loadOrders();
 refreshIndicator.classList.toggle("text-success");
},30000);

loadKPIs();
loadOrders();
</script>

</body>
</html>
