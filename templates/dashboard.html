<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard – Quilt & Drapes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f9;font-size:14px;}
.container-max{max-width:1400px;margin:auto;}
.navbar{background:#1f2933;}

/* KPI */
.kpi-card{
  border-radius:18px;
  padding:18px;
  color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.kpi-title{font-size:13px;opacity:.9}
.kpi-value{font-size:26px;font-weight:700}
.kpi-orders{background:linear-gradient(135deg,#2563EB,#1D4ED8);}
.kpi-pending{background:linear-gradient(135deg,#D97706,#B45309);}
.kpi-stitching{background:linear-gradient(135deg,#7C3AED,#5B21B6);}
.kpi-completed{background:linear-gradient(135deg,#10B981,#059669);}

/* Search & Filters */
.search-bar{max-width:300px}

/* Kanban */
.kanban-wrapper{overflow-x:auto;padding-bottom:8px;}
.kanban-board{display:flex;gap:16px;min-width:1250px;}
.kanban-column{
  flex:0 0 270px;
  background:#fff;
  border-radius:16px;
  padding:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}
.completed-column{background:linear-gradient(#ecfdf5,#d1fae5);}
.column-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.count-badge{
  background:#1f2933;
  color:#fff;
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
}

/* Cards */
.kanban-card{
  background:#f9fafb;
  border-left:5px solid #cbd5e1;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s;
}
.kanban-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(0,0,0,.1);
}

/* Status colors */
.order-fabric-order-pending{border-left-color:#F59E0B;}
.order-fabric-in-transit{border-left-color:#0EA5E9;}
.order-stitching{border-left-color:#7C3AED;}
.order-hardware-material-installation{border-left-color:#8B5CF6;}
.order-completed{border-left-color:#10B981;}

/* Tailor highlight */
.tailor-highlight-dev{border:2px solid #2563eb;}
.tailor-highlight-dinesh{border:2px solid #f97316;}

/* Overdue glow */
.order-urgent{animation:pulseGlow 1.8s infinite;}
@keyframes pulseGlow{
  0%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}
  70%{box-shadow:0 0 0 12px rgba(220,38,38,0);}
  100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}
}

/* Mobile stacking */
@media(max-width:768px){
  .kanban-board{flex-direction:column;min-width:100%;}
  .kanban-column{flex:1 1 auto;}
}

.fab{
  position:fixed;right:20px;bottom:20px;
  width:56px;height:56px;border-radius:50%;
  background:#2563eb;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;text-decoration:none;
}
</style>
</head>
<body>

<nav class="navbar navbar-dark px-4">
  <span class="navbar-brand">Quilt & Drapes</span>
  <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container-max px-3 mt-4">

<!-- Search & Filters -->
<div class="d-flex gap-3 align-items-center mb-3 flex-wrap">
  <input id="searchInput" class="form-control search-bar" placeholder="Search name / phone / showroom">

  <select id="tailorFilter" class="form-select" style="max-width:160px">
    <option value="">All Tailors</option>
    <option>Dev</option>
    <option>Dinesh</option>
  </select>

  <select id="fitterFilter" class="form-select" style="max-width:160px">
    <option value="">All Fitters</option>
    <option>Dev</option>
    <option>Dinesh</option>
    <option>Krishna</option>
  </select>
</div>

<!-- KPI -->
<div class="row g-3 mb-4">
  <div class="col-md-3">
    <div class="kpi-card kpi-orders">
      <div class="kpi-title">Orders</div>
      <div id="kpiOrders" class="kpi-value">0</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card kpi-pending">
      <div class="kpi-title">Fabric Order Pending</div>
      <div id="kpiFabricPending" class="kpi-value">0</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card kpi-stitching">
      <div class="kpi-title">Stitching</div>
      <div id="kpiStitching" class="kpi-value">0</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card kpi-completed">
      <div class="kpi-title">Completed</div>
      <div id="kpiCompleted" class="kpi-value">0</div>
    </div>
  </div>
</div>

<div class="kanban-wrapper">
<div class="kanban-board" id="kanbanBoard"></div>
</div>

</div>

<a href="/calculator" class="fab">+</a>

<script>
const STATUSES=[
"Fabric Order Pending",
"Fabric In Transit",
"Stitching",
"Hardware/Material Installation",
"Completed"
];

async function loadKPIs(){
  const d=await(await fetch("/api/dashboard/kpis")).json();
  kpiOrders.innerText=d.orders||0;
  kpiFabricPending.innerText=d.fabric_pending||0;
  kpiStitching.innerText=d.stitching||0;
  kpiCompleted.innerText=d.completed||0;
}

async function loadOrders(){
  const res=await fetch("/api/orders/list");
  const data=await res.json();
  renderBoard(data);
}

function renderBoard(data){
  const board=document.getElementById("kanbanBoard");
  board.innerHTML="";
  const search=searchInput.value.toLowerCase();
  const tailorVal=tailorFilter.value;
  const fitterVal=fitterFilter.value;
  const today=new Date();
  let firstUrgent=null;
  let tailorCount={};

  STATUSES.forEach(status=>{
    const statusClass=status.toLowerCase().replaceAll(" ","-").replaceAll("/","-");

    const filtered=data.filter(o=>{
      return o.status===status &&
      (!search ||
       o.name?.toLowerCase().includes(search) ||
       o.phone?.includes(search) ||
       o.showroom?.toLowerCase().includes(search)) &&
      (!tailorVal || o.tailor===tailorVal) &&
      (!fitterVal || o.fitter===fitterVal);
    });

    const col=document.createElement("div");
    col.className="kanban-column"+(status==="Completed"?" completed-column":"");
    col.dataset.status=status;

    col.innerHTML=`
      <div class="column-header">
        <h6>${status}</h6>
        <span class="count-badge">${filtered.length}</span>
      </div>
      <div class="kanban-drop"></div>
    `;

    const drop=col.querySelector(".kanban-drop");

    filtered.forEach(o=>{
      if(o.tailor){
        tailorCount[o.tailor]=(tailorCount[o.tailor]||0)+1;
      }

      let urgent="";
      if(o.due_date){
        const diff=Math.ceil((new Date(o.due_date)-today)/(1000*60*60*24));
        if(diff<0){urgent="order-urgent";if(!firstUrgent) firstUrgent=o.order_id;}
      }

      const tailorClass=o.tailor?
        "tailor-highlight-"+o.tailor.toLowerCase():"";

      drop.innerHTML+=`
        <div class="kanban-card order-${statusClass} ${urgent} ${tailorClass}"
             draggable="true"
             onclick="openOrder('${o.order_id}')"
             ondragstart="drag(event)"
             data-id="${o.order_id}">
          <strong>${o.name}</strong><br>
          ${o.item_count} windows<br>
          ${o.showroom}

          <div class="mt-2 small text-muted">
            👕 Tailor: <strong>${o.tailor||"-"}</strong><br>
            🔧 Fitter: <strong>${o.fitter||"-"}</strong>
          </div>

          <div class="mt-2">
            <button onclick="event.stopPropagation();sendWhatsApp('${o.phone}')"
              class="btn btn-success btn-sm py-0 px-2">WA</button>
          </div>
        </div>`;
    });

    enableDrop(drop);
    board.appendChild(col);
  });

  console.log("Tailor workload:",tailorCount);

  if(firstUrgent){
    setTimeout(()=>{
      document.querySelector(".order-urgent")?.scrollIntoView({behavior:"smooth",block:"center"});
    },500);
  }
}

function enableDrop(col){
  col.ondragover=e=>e.preventDefault();
  col.ondrop=async e=>{
    e.preventDefault();
    const id=e.dataTransfer.getData("id");
    const newStatus=col.parentElement.dataset.status;

    await fetch(`/api/orders/${id}/status`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:newStatus})
    });

    loadKPIs();
    loadOrders();
  };
}

function drag(ev){ev.dataTransfer.setData("id",ev.target.dataset.id);}
function openOrder(id){location.href=`/calculator?order_id=${id}`;}
function sendWhatsApp(phone){
  const clean=phone.replace(/\D/g,'');
  window.open(`https://wa.me/91${clean}`,"_blank");
}

searchInput.addEventListener("input",loadOrders);
tailorFilter.addEventListener("change",loadOrders);
fitterFilter.addEventListener("change",loadOrders);

loadKPIs();
loadOrders();
</script>

</body>
</html>
