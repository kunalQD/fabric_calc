<!DOCTYPE html>
<html>
<head>
<title>Installation Calendar – Quilt & Drapes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body{
  background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
  margin:0;
  font-family:Arial;
}


.calendar-card{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}

h4{
  margin-bottom:20px;
  font-weight:600;
}

.fc-daygrid-day:hover{
  background:#f3f4f6;
  cursor:pointer;
}

.nav-link.active{
  font-weight:600;
  border-bottom:2px solid #fff;
}

</style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-semibold" href="/dashboard">
    Quilt & Drapes
  </a>

  <button class="navbar-toggler" type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="mainNavbar">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

      <li class="nav-item">
        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}"
           href="/dashboard">
           Dashboard
        </a>
      </li>

      {% if session.get('role') == 'admin' %}
      <li class="nav-item">
        <a class="nav-link {% if request.path == '/billing' %}active{% endif %}"
           href="/billing">
           Billing
        </a>
      </li>
      {% endif %}

      <li class="nav-item">
        <a class="nav-link {% if request.path == '/calendar' %}active{% endif %}"
           href="/calendar">
           Calendar
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if request.path == '/calculator' %}active{% endif %}"
           href="/calculator">
           New Order
        </a>
      </li>

    </ul>

    <div class="d-flex align-items-center gap-3">
      <span class="text-success small">● Live</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">
        Logout
      </a>
    </div>
  </div>
</nav>

<div class="container mt-4">
<h4>Installation Calendar</h4>
<div id="calendar"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded',async()=>{
const res=await fetch("/api/orders/list");
const orders=await res.json();

const events=orders.map(o=>({
title:o.name+" ("+o.status+")",
start:o.due_date,
color:o.status==="Completed"?"#16a34a":
      o.status==="Stitching"?"#7C3AED":
      o.status==="Fabric Order Pending"?"#F59E0B":
      o.status==="Hardware/Material Installation"?"#8B5CF6":
      "#0EA5E9"
}));

new FullCalendar.Calendar(document.getElementById('calendar'),{
initialView:'dayGridMonth',
events:events,
height:"auto"
}).render();
});
</script>

</body>
</html>
